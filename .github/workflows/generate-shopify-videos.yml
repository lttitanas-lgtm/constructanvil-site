name: Generate Shopify Ads

on:
  push:
    paths:
      - '.github/workflows/generate-shopify-videos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Generate 20 product videos
        run: python scripts/generate_shopify_ads.py
      - name: Commit generated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shopify-videos/*.mp4
          if git diff --cached --quiet; then
            echo "No video changes to commit"
          else
            git commit -m "Generate 20 Shopify product ads"
            git push origin HEAD:main
          fi
